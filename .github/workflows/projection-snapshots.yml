name: Projection Snapshots

# Captures what every projection source said before each deadline, and what
# actually happened afterwards. This has to be a scheduled job rather than
# something the app does: history that only accrues when someone opens Streamlit
# has holes in it, and a missed gameweek cannot be recovered -- FFP rolls its
# publication window forward and the old week is gone from their site
# permanently. That is exactly how GW3's FFP projections were lost.
#
# Deliberately a separate workflow from fpl-notifications.yml, not another step
# in it: a snapshot failure must never stop a deadline alert from going out.

# Two schedules, because GitHub does not honour cron reliably. Declared hourly,
# this workflow was observed running every 2.5-6 hours (mean 4.4), so roughly
# three quarters of the runs were dropped. With an 8-hour pre-deadline window
# that meant typically ONE run landed inside it -- the earliest -- and the
# stored file froze there: GW4 was captured 7.8 hours before its deadline and
# never refreshed, so the harness scored every source on its pre-team-news
# state rather than on what a manager would actually have acted on.
#
# The hourly cron stays as the safety net that guarantees a gameweek is never
# missed outright. The dense one covers the final approach: deadlines this
# season fall between 10:00 and 18:00 UTC, so 09:00-18:59 brackets the last
# hours before every one of them. It is every day rather than Fri/Sat because
# 7 of the 38 deadlines are midweek, and those are the awkward ones to lose.
#
# The collector itself exits in seconds outside the capture window (see
# within_pre_deadline_window), so the added cost is almost entirely dependency
# installation -- which is why pip is cached below.
on:
  schedule:
    - cron: "17 * * * *"        # hourly safety net, off the hour to avoid the crush
    - cron: "*/15 9-18 * * *"   # dense cover for the final hours before a deadline
  workflow_dispatch:
    inputs:
      gameweek:
        description: "Force a snapshot for this gameweek (blank = automatic)"
        required: false
        type: string

# Serialise runs. Two collectors writing the same file and both pushing is a
# guaranteed conflict, and this job has no deadline to race.
concurrency:
  group: projection-snapshots
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          # The dominant cost of a run that does nothing, and this now runs up
          # to 64 times a day.
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Collect projections and actuals
        env:
          # Optional. Absent, the snapshot simply carries no odds -- the
          # collector treats a missing key as "not configured", not an error.
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ -n "${{ inputs.gameweek }}" ]; then
            python -m scripts.common.projection_snapshot --gameweek "${{ inputs.gameweek }}"
          else
            python -m scripts.common.projection_snapshot
          fi

      - name: Commit new snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add archive/projections archive/ffp
          # The collector rewrites a file only when its rows actually changed,
          # so an unchanged run stages nothing and this is a clean no-op.
          if git diff --staged --quiet; then
            echo "No projection changes to commit."
            exit 0
          fi
          git commit -m "Archive projections [skip ci]"
          # Another run may have pushed since checkout; rebase rather than fail.
          git pull --rebase --autostash origin main
          git push
