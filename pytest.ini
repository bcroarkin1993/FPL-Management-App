[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -v --tb=short
markers =
    live: hits real Rotowire/FFP/FPL endpoints. Skips when a source is
        unreachable, fails when its data is implausible. Disable with
        `-m "not live"` or FPL_SKIP_LIVE_TESTS=1.
